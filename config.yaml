# Personal digest threshold (lower = more jobs, more noise)
min_score: 4

# Public broadcast threshold (higher = only strong fits go to the channel)
public_min_score: 6

# Seniority blocklist — instant reject if in TITLE
title_blocklist:
  - senior
  - sr.
  - sr 
  - staff
  - principal
  - lead
  - head of
  - director
  - manager
  - vp
  - chief
  - architect

# Off-domain roles — instant reject if in TITLE
# (loosened: removed frontend, full stack, solutions, support)
title_role_blocklist:
  - devops
  - sre
  - qa
  - quality assurance
  - test engineer
  - sales
  - marketing
  - designer
  - data scientist
  - mobile
  - android
  - ios

# Title gate — job title must contain at least one of these
title_must_match_any:
  - python
  - ai
  - llm
  - ml
  - machine learning
  - automation
  - backend
  - back-end
  - back end
  - rag
  - agent
  - software engineer
  - software developer
  - developer
  - engineer
  - data
  - api
  - platform
  - infrastructure
  - founding engineer

# Bonus points for these in the TITLE
title_bonus:
  python: 4
  llm: 5
  rag: 5
  langchain: 4
  langgraph: 5
  agent: 4
  automation: 4
  ai engineer: 6
  founding engineer: 6
  junior: 5
  entry: 4
  associate: 3
  graduate: 4
  intern: 2
  backend: 2
  developer: 1

# Positive keyword matches anywhere
